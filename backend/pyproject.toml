[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "jarvis-os"
version = "0.1.0"
description = "Local-first, voice-and-text personal AI operating assistant"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "httpx>=0.27",
  "cryptography>=43",
  "jsonschema>=4.23",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "playwright>=1.49",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
]
desktop = [
  "pyautogui>=0.9.54",
  "pyperclip>=1.11",
  "pywinauto>=0.6.9",
  "psutil>=7.0",
  "pillow>=11",
  "pywin32>=308; sys_platform == 'win32'",
  "send2trash>=2.1",
]

[project.scripts]
jarvis = "jarvis.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]
